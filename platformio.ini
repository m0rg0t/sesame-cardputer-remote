; Sesame Robot Remote for M5Stack Cardputer ADV

[platformio]
default_envs = cardputer-adv-sesame

[env:cardputer-adv-sesame]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<sim/*>
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DSESAME_REMOTE_VERSION=\"0.1.0\"
    -Wl,--wrap=esp_wifi_init
    -fmerge-all-constants
extra_scripts =
    post:scripts/check_m5apps_size.py
lib_deps =
    m5stack/M5Unified@0.2.17
    https://github.com/m5stack/M5GFX.git#0.2.22
    m5stack/M5Cardputer@1.1.1

[env:native-sim]
platform = native
build_type = debug
build_src_filter =
    -<*>
    +<sim/main.cpp>
build_flags =
    -std=c++17
    -Isim/stubs
    -DSESAME_REMOTE_VERSION=\"0.1.0\"
    -DM5GFX_BOARD=board_M5Cardputer
    -DM5GFX_SCALE=4
    !sdl2-config --cflags
    !sdl2-config --libs
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.22
